name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate preset files exist
        run: |
          test -f preset/agent.cordis.yml
          test -f preset/preset.yml
          for skill in preset/skills/*/SKILL.md; do
            test -f "$skill" && echo "OK: $skill"
          done
      - name: Check install script syntax
        run: bash -n install.sh && bash -n uninstall.sh
      - name: Check README bilingual switch
        run: |
          test -f README.md && echo "OK: README.md (English)"
          test -f README.zh-CN.md && echo "OK: README.zh-CN.md (Chinese)"
          # 中英文 README 应互含语言切换链接
          grep -q "README.zh-CN" README.md && echo "OK: EN README links to ZH"
          grep -q "README.md" README.zh-CN.md && echo "OK: ZH README links to EN"
      - name: Check no personal paths or secrets
        run: |
          # 扫描仓库内容（排除本 CI 文件自身的模式定义），防止误判
          if grep -rnE "sk-[a-zA-Z0-9]{20}|ghp_[a-zA-Z0-9]{20}" --include="*.md" --include="*.yml" --include="*.sh" .; then
            echo "Found secret-like patterns"; exit 1
          fi
          echo "No secrets"
      - name: Check private work materials stay out of Git
        run: |
          # 运行模式的过程材料必须留在被忽略的 .product-team/，不能进入公开仓库。
          git check-ignore -q .product-team/
          if git ls-files | grep -E '(^|/)\.product-team/|(^|/)(idea-validation|product-definition|tasks|PROMO|AUDIT|DEPLOY|RELEASE|RELEASE-HANDOFF|OPERATIONS|ROADMAP|TECH-DESIGN|PRD)\.md$|(^|/)research(-|/)' ; then
            echo "Found private product-team materials in the public payload"
            exit 1
          fi
          echo "Private work materials are excluded"
