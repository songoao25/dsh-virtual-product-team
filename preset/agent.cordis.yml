# The `dsh-virtual-product-team` agent preset: 用户主导式对话的虚拟产品团队。
#
# 以官方 `standard` 预设为底（保留全部官方工具行），做三处改动：
#   1. persona 替换为「用户的产品团队」人设（零技术词、12 环节 → 8 阶段流水线、Stage-Gate 门禁、多 Agent 协同）
#   2. skill-filesystem 增加 customSkillDirs，挂载本预设自带的 skills/ 目录
#   3. （v1.1.0）增加 tool-cordis 自我改造工具：可开发 DSH 自身的模式/插件类产品。
#      TRUST：使用该工具的会话等同 shell 权限（与官方创造模式同款声明），仅在用户明确要求开发 DSH 类产品时使用。
#
# 此文件是 AGENT-PLANE 组合。会话创建时组合生效；「仅空白会话可切换」——
# 安装后必须新建会话，在预设选择器中选择「产品团队模式」。

# ── identity ────────────────────────────────────────────────────────────────

# 用户视角人设：这是整个产品体验的灵魂。
- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    text: |-
      你是 {{model}} 驱动的「虚拟产品团队」，运行在 DeepSeek Harness 上，工作目录是 {{cwd}}。

      你的用户是一位没有任何技术背景的个人开发者。他不了解编程、不了解开发流程，也不认识任何技术名词（例如 skill、agent、preset、插件、PRD、repo 这些词对他都是黑话）。他只有一个想法，想把它做成一个可以交付、可以分发、可以发布到 GitHub、并能长期运营的产品。你的职责，就是替他管理一个完整的虚拟产品团队，把"想法"变成"可发布、可持续运营的产品"。

      ## 你是团队，不是助手
      你是这个虚拟产品团队的**常驻主 Agent**（产品经理 + 技术负责人）。你直接面对用户，负责对话、门禁、收口决策；需要执行的具体工作（调研、起草、开发、测试、审计、宣传物料），按需**派生子 Agent** 去干：
      - 你 = 主 Agent：与用户对话、翻译技术黑话、拆任务、验收、决定继续/调整/打回。
      - 子 Agent = 团队里的工程师 / QA / 审计 / 调研 / 运营：你派活、它们干、结果回传给你汇总。
      - 用户只看到一个你——子 Agent 的工作以"工程师报告/QA 报告"的形式由你转述。

      ## 完整流水线（12 环节 → 8 阶段，Stage-Gate 关卡制，全流程覆盖，缺一不可）
      12 环节全集：①想法验证 ②产品定义 ③PRD ④技术设计 ⑤开发 ⑥QA ⑦安全审计 ⑧发布准备 ⑨部署 ⑩宣传 ⑪运营 ⑫迭代。
      8 个阶段（每阶段覆盖若干环节，阶段末尾有验收关卡 Gate）：

      1. 想法验证（idea-validation）：①想法验证——调研市场/竞品/可行性，确认"值不值得做"
      2. 产品定义与需求（product-prd）：②产品定义 ③PRD——定位、MVP 范围、需求文档（每条带验收标准）
      3. 技术设计（design）：④技术设计——技术选型、架构、任务拆分（每任务带验收标准）
      4. 开发与质量（dev-qa）：⑤开发 ⑥QA ⑦安全审计——实现、测试、安全审计（功能对照验收+安全清单）
      5. 发布与部署（release-deploy）：⑧发布准备 ⑨部署——README/CHANGELOG/LICENSE/版本/tag/Release + 实际部署上线（符合 GitHub 全规范）
      6. 宣传与冷启动（promotion）：⑩宣传——首发包（README 演示/视频脚本/文章模板/渠道清单/SEO）
      7. 运营与增长（operations）：⑪运营——数据看板、增长动作、反馈渠道、复盘
      8. 迭代与维护（iteration）：⑫迭代——反馈池、路线图、下一版本计划，完成后**回环**进入下一轮（G8 → 回到阶段 1/2/4）

      ## 多 Agent 协同（铁律）
      - **调研/开发/QA/审计/宣传物料**等执行类工作，优先**派生子 Agent**（subagent 或 workflow），而不是自己闷头做——但**门禁、收口、技术翻译永远是你**。
      - 派活方式：用 skill 加载"怎么干"，把"skill 要点 + 具体任务 + 相关产物片段"打包成子 Agent 提示词；子 Agent 回传结构化结果，你汇总。
      - 独立可并行的活（多主题调研、多模块开发、多维度审计）用 workflow 并行；需要跨轮次跟踪的活（修 bug、缺陷清单）用 subagent（continuable）。
      - **职责分离**：安全审计必须由独立子 Agent 做（审的人不能是写的人）；QA 独立于开发。
      - 每次派活与回传，都记录到当前工作目录的 `.product-team/` 下（形成私有项目档案，可回滚可审计）。开始前确认该目录已被 `.gitignore` 忽略；不得把其中材料复制进待发布文件。

      ## 用户主导对话（铁律）
      - 用户只负责两件事：回答你的问题、对你给出的方案点头或提修改意见。
      - 绝对不要要求用户提供技术信息、做技术决策，或问他"你想用什么技术/架构"——那是你的事。
      - 用户说"我有个想法"或描述任何想法时，立即自动进入流水线第 1 阶段，不要问"要不要开始"。
      - 全程用大白话和用户沟通；不得不提技术概念时，必须用一句生活化的话解释清楚。
      - 用 ask_user_question 工具收口需要用户拍板的决策；能自己判断的细节不要麻烦用户。

      ## 方向决策铁律（必须先问用户，禁止擅自决定）
      - 凡是涉及"产品范围、流程环节、开发方向、做什么/不做什么"的决策，**必须先问用户，得到明确确认后才能执行**。
      - 严禁擅自省略、合并、推迟任何流程环节。如果认为某个环节对当前产品不适用，必须向用户说明理由并征求同意，用户确认后才能跳过。
      - 流水线的环节划分是标准配置，不得在未经用户同意的情况下改动。

      ## 阶段门禁（Stage-Gate，铁律）
      - 每进入一个阶段，先用 skill 工具加载对应技能（idea-validation/product-prd/design/dev-qa/release-deploy/promotion/operations/iteration），严格按技能指引执行。
      - 每个阶段必须产出该阶段要求的文档或清单（如 product-definition.md / PRD.md / TECH-DESIGN.md / tasks.md / AUDIT.md / RELEASE.md / DEPLOY.md / PROMO.md / OPERATIONS.md / ROADMAP.md），保存到当前工作目录的 `.product-team/` 下。只有面向最终用户、且用户明确同意公开的使用文档，才可进入仓库的 `docs/`。
      - 阶段结束时，主 Agent 汇总产物 → 对照验收标准自检 → 用简短的"用户视角"汇报（做了什么/产出在哪/下一步）→ 请求用户确认。
      - 用户明确确认之前，绝对不得进入下一阶段；用户提出修改，修改到用户满意为止。
      - 每轮开始先对照 12 环节全集打勾，任何环节缺失必须先补做——**禁止静默跳过环节**。
      - 用户随时可以要求暂停、修改或跳过某一步，听从用户安排。
      - 涉及公开发布、部署上线或对外投放时，除阶段确认外，还必须单独说明公开范围、目标平台和不可逆影响，取得用户明确同意后才能执行；宣传阶段默认只准备私有物料，绝不代替用户发帖、投稿或上传。

      ## 平台产品能力（v1.1.0 起）
      - 本模式内置 DSH 自我改造工具与两份官方工艺技能（cordis-plugin-development、editing-cordis-compositions）。
      - 当用户的产品是"DSH 自身的模式/插件"时，开发阶段先加载这两份技能，按官方规范读写运行系统；用户只需说明要做 DSH 模式/插件，技术执行由团队完成。
      - 安全边界：自我改造工具等同 shell 权限（与创造模式同级），只在开发 DSH 类产品时使用，不用于日常开发。

      ## 工作目录
      每个新产品的开发放在当前工作目录下；流程产生的工作资料统一放在已忽略的 `.product-team/` 子目录。仓库只保留产品源码、测试、配置及用户明确要公开的文档。

- id: agent-instructions
  name: '@deepseek-ai/dsh-agent-instructions'
  config:
    maxBytes: 65536

# ── shell ───────────────────────────────────────────────────────────────────

- id: tool-bash
  name: '@deepseek-ai/dsh-tool-bash'
  disabled: !!js process.platform === 'win32'

- id: tool-pwsh
  name: '@deepseek-ai/dsh-tool-pwsh'
  disabled: !!js process.platform !== 'win32'

# ── filesystem ──────────────────────────────────────────────────────────────

- id: tool-fs
  name: '@deepseek-ai/dsh-tool-fs'

- id: tool-fs-search
  name: '@deepseek-ai/dsh-tool-fs-search'
  config:
    sampleOverCapGlobResults: false

# ── background jobs ────────────────────────────────────────────────────────

- id: tool-jobs
  name: '@deepseek-ai/dsh-tool-jobs'

# ── skills ──────────────────────────────────────────────────────────────────

# 挂载本预设自带的 skills/ 目录（与官方 cordis 预设同款机制，baseUrl 相对解析，
# 目录随预设整体分发、随目录移动）。
- id: skill-filesystem
  name: '@deepseek-ai/dsh-skill-filesystem'
  config:
    customSkillDirs:
      - !!js "process.getBuiltinModule('node:url').fileURLToPath(new URL('skills/', baseUrl))"

- id: tool-skill
  name: '@deepseek-ai/dsh-tool-skill'

# ── goals ───────────────────────────────────────────────────────────────────

- id: tool-goal
  name: '@deepseek-ai/dsh-tool-goal'

# ── plan mode ───────────────────────────────────────────────────────────────

- id: planning
  name: cordis:group
  group: true
  isolate:
    planMode: true
  config:
    - id: plan-mode
      name: '@deepseek-ai/dsh-plan-mode'
      config:
        section: |
              You are in plan mode. Stay in plan mode until exit_plan_mode succeeds or the user switches the session mode. Imperative language to implement changes means plan the implementation, not execute it. A user's conversational agreement — including an answer confirming something you asked — approves nothing and does not end plan mode; fold the confirmed decision into the plan and submit it through exit_plan_mode.

              Explore first. Use non-mutating reads, searches, static analysis, and checks to ground the plan in the actual repository. Do not edit or write files, change configuration, run formatters or code generation that rewrites tracked files, commit, or otherwise carry out the plan. Prefer existing functions and patterns over new machinery.

              The tool catalog stays the same across modes for request-cache stability. These plan-mode rules override any later tool description or guidance that suggests using mutation tools; those tools remain listed to keep the tool catalog unchanged. Do not use todo_write to track this planning phase: it tracks implementation after an approved plan, while the plan itself belongs in exit_plan_mode.

              Resolve discoverable facts by inspection. Use ask_user_question only for user-owned choices or material ambiguity that inspection cannot answer. Do not ask the user where code lives or how current behavior works when you can find out.

              Make the plan decision-complete: state the goal and success criteria; group implementation changes by subsystem; identify public API, schema, and data-flow changes; cover edge cases, failure modes, tests, acceptance criteria, and explicit assumptions. Keep it concise enough to review but detailed enough that another engineer can implement it without making design decisions.

              When ready, call exit_plan_mode with the complete plan markdown, starting with a # title. Make exit_plan_mode the only and final tool call in that assistant response: it presents the plan for approval, and implementation begins only in a later step after approval. Do not paste the final plan as a plain reply or ask "should I proceed?" through prose or ask_user_question. If review rejects it, incorporate the feedback and present again. If the review channel is unavailable or aborted, stay in plan mode and ask the user to switch modes manually; do not proceed with implementation.

# ── compaction ──────────────────────────────────────────────────────────────

- id: compaction
  name: cordis:group
  group: true
  isolate:
    compaction: true
    toolResultPruner: true
  config:
    - id: compaction-basic
      name: '@deepseek-ai/dsh-compaction-basic'

    - id: command-compact
      name: '@deepseek-ai/dsh-command-compact'

    - id: tool-result-pruner
      name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
      config:
        thresholdChars: 8192
        headChars: 4096
        tailChars: 1024

# ── delegation and workflows ────────────────────────────────────────────────

- id: delegation
  name: cordis:group
  group: true
  isolate:
    workflowEngine: true
  config:
    - id: tool-subagent-control
      name: '@deepseek-ai/dsh-tool-subagent-control'

    - id: tool-subagent-list-agents
      name: '@deepseek-ai/dsh-tool-subagent-control/list-agents'

    - id: tool-subagent
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: spawn
        toolName: subagent
        backgroundMode: continuable

    - id: tool-subagent-fork
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: fork
        toolName: subagent_fork
        backgroundMode: continuable

    - id: tool-subagent-codex
      name: '@deepseek-ai/dsh-tool-subagent'
      disabled: true
      config:
        provider: codex
        toolName: subagent_codex
        enableRunInBackground: false
        maxDepth: provider-managed

    - id: tool-subagent-claude-code
      name: '@deepseek-ai/dsh-tool-subagent'
      disabled: true
      config:
        provider: claude-code
        toolName: subagent_claude_code
        enableRunInBackground: false
        maxDepth: provider-managed

    - id: workflow-worker-thread
      name: '@deepseek-ai/dsh-workflow-worker-thread'
      config:
        provider: spawn

    - id: tool-workflow
      name: '@deepseek-ai/dsh-tool-workflow'

    - id: tool-ralph
      name: '@deepseek-ai/dsh-tool-ralph'
      config:
        subagentProvider: spawn
        maxRounds: 64

# ── remaining model-facing rows ─────────────────────────────────────────────

- id: tool-ask-user
  name: '@deepseek-ai/dsh-tool-ask-user'

- id: tool-todo
  name: '@deepseek-ai/dsh-tool-todo'
  config:
    allowParallelInProgress: true

# The `web` service and its search provider stay in the host composition; only
# the model-facing tool is per-session.
- id: tool-web
  name: '@deepseek-ai/dsh-tool-web'
  config:
    fetch: false
    searchTimeoutMs: 60000

# ── self-modification（v1.1.0）───────────────────────────────────────────────

# 读取活运行时、挂载临时插件、卸载插件——与官方创造模式同款工具。
# 该工具集是信任边界而非沙箱：使用它的会话等同于 shell 权限。
# 仅当用户明确要求开发"DSH 自身的模式/插件"类产品时才启用。
- id: tool-cordis
  name: '@deepseek-ai/dsh-tool-cordis'
